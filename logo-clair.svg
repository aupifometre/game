<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="aupifomètre">
  <defs><clipPath id="tile"><rect width="512" height="512" rx="104"/></clipPath></defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="#F4EFE3"/>
    <g fill="#1B160F" opacity="#1B160FOP">#1B160FS</g>

    <!-- le cadran : trois zones, comme la jauge du verdict -->
    <g fill="none" stroke-width="36" stroke-linecap="butt">
      <path d="M 100 340 A 156 156 0 0 1 145.7 229.7" stroke="#1B160F" opacity=".26"/>
      <path d="M 157.4 218 A 156 156 0 0 1 299.7 187.2" stroke="#1B160F" opacity=".52"/>
      <path d="M 314.9 194 A 156 156 0 0 1 412 340" stroke="#FF4D00"/>
    </g>

    <!-- graduations, seulement en haut du cadran -->
    <g stroke="#1B160F" stroke-width="8" stroke-linecap="round" opacity=".9">
      <line x1="256" y1="130" x2="256" y2="156"/>
      <line x1="145.4" y1="176.4" x2="163.8" y2="194.8"/>
      <line x1="366.6" y1="176.4" x2="348.2" y2="194.8"/>
    </g>

    <!-- l'aiguille : elle pointe dans la zone basse — le doigt mouillé -->
    <g transform="rotate(-56 256 340)">
      <path d="M 256 340 L 240.5 322 L 256 218 L 271.5 322 Z" fill="#FF4D00"/>
    </g>
    <circle cx="256" cy="340" r="31" fill="#1B160F"/>
    <circle cx="256" cy="340" r="12.5" fill="#F4EFE3"/>
  </g>
</svg>